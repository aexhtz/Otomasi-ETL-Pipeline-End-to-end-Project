name: Otomasi ETL Pipeline End-to-end

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      max_halaman:
        description: "Jumlah halaman listing"
        required: false
        default: "2"

jobs:
  jalankan-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python ver - 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/pipeline.txt

      - name: Install dependensi
        run: pip install -r requirements/pipeline.txt

      - name: Install playwright
        run: playwright install chromium

      - name: Pipeline
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          MAX_HALAMAN: ${{ github.event.inputs.max_halaman || vars.MAX_HALAMAN }}
          REQUEST_DELAY: ${{ vars.REQUEST_DELAY }}
          DISCORD_ERROR_WEBHOOK_URL: ${{ vars.DISCORD_ERROR_WEBHOOK_URL }}
          DISCORD_WARNING_WEBHOOK_URL: ${{ vars.DISCORD_WARNING_WEBHOOK_URL }}
        run: python pipeline.py || python pipeline.py

      - name: Upload logging
        uses: actions/upload-artifact@v4
        with:
          name: logging-pipeline
          path: logs/pipeline/
