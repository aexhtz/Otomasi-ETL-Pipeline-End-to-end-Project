name: Otomasi Rekonsiliasi Data

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  jalankan-rekonsiliasi:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ver - 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependensi
        run: pip install -r requirements/pipeline.txt

      - name: Install Playwright
        run: playwright install chromium

      - name: Rekonsiliasi
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          REQUEST_DELAY: ${{ vars.REQUEST_DELAY }}
          MAX_HALAMAN_REKONSILIASI: ${{ vars.MAX_HALAMAN_REKONSILIASI }}
          DISCORD_WEBHOOK_URL: ${{ vars.DISCORD_WEBHOOK_URL }}
        run: python rekonsiliasi.py || python rekonsiliasi.py

      - name: Upload logging
        uses: actions/upload-artifact@v4
        with:
          name: logging-rekonsiliasi
          path: logs/reconciler/
