name: Otomasi Clustering (ML)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  clustering:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ver - 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/clustering_ml.txt

      - name: Install dependensi
        run: pip install -r requirements/machine_learning.txt

      - name: Clustering
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: python clustering_ml.py || python clustering_ml.py
